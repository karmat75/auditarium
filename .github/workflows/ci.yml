name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-format:
    name: Build, test, and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Auditarium.sln --locked-mode

      - name: Build
        run: dotnet build Auditarium.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Auditarium.sln --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format Auditarium.sln --verify-no-changes --no-restore
