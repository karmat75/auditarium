name: Continuous Integration

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Manual CI · {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-format:
    name: Build, test, and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Auditarium.sln --locked-mode

      - name: Build
        run: dotnet build Auditarium.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Auditarium.sln --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format Auditarium.sln --verify-no-changes --no-restore
