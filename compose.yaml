# SPDX-License-Identifier: MIT
services:
  workspace:
    build:
      context: .
      target: development
    command: sleep infinity
    working_dir: /workspace
    environment:
      HOME: /tmp
      NUGET_PACKAGES: /tmp/.nuget/packages
    volumes:
      - .:/workspace:cached

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auditarium
      POSTGRES_USER: auditarium
      POSTGRES_PASSWORD: auditarium-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data

  auditarium:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      AUDITARIUM__Database__Provider: PostgreSQL
      AUDITARIUM__Database__ConnectionString: Host=postgres;Database=auditarium;Username=auditarium;Password=auditarium-development-only
      AUDITARIUM__Database__BootstrapTimeoutSeconds: "180"
      AUDITARIUM__DataProtection__KeyRingPath: /var/lib/auditarium/keys
      AUDITARIUM__DataProtection__ApplicationName: Auditarium
      AUDITARIUM__Storage__RootPath: /var/lib/auditarium/storage
    volumes:
      - data-protection-keys:/var/lib/auditarium/keys
      - storage-data:/var/lib/auditarium/storage
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "8081:8080"
    environment:
      AUDITARIUM__Database__Provider: PostgreSQL
      AUDITARIUM__Database__ConnectionString: Host=postgres;Database=auditarium;Username=auditarium;Password=auditarium-development-only
      AUDITARIUM__Database__BootstrapTimeoutSeconds: "180"
      AUDITARIUM__DataProtection__KeyRingPath: /var/lib/auditarium/keys
      AUDITARIUM__DataProtection__ApplicationName: Auditarium
      AUDITARIUM__Storage__RootPath: /var/lib/auditarium/storage
    volumes:
      - data-protection-keys:/var/lib/auditarium/keys
      - storage-data:/var/lib/auditarium/storage
    depends_on:
      auditarium:
        condition: service_healthy

volumes:
  postgres-data:
  data-protection-keys:
  storage-data:
